# General
terminal-transcript-rows = 10000
hide-soft-keyboard-on-startup = true
disable-terminal-session-change-toast = true
extra-keystroke-sound = false
pointer-keys = true

# Cursor
terminal-cursor-blink-rate = 500
terminal-cursor-style = bar

# Extra keys (Tokyo Night themed - compact layout)
extra-keys-style = arrows-only
extra-keys = [ \
  [{key: 'ESC', display: '⎋'}, '/', '-', {key: 'HOME', display: '⇱'}, {key: 'UP', display: '↑'}, {key: 'END', display: '⇲'}, {key: 'PGUP', display: '⇞'}, '|'], \
  [{key: 'TAB', display: '⇥'}, {key: 'CTRL', display: '⌃'}, {key: 'ALT', display: '⌥'}, {key: 'LEFT', display: '←'}, {key: 'DOWN', display: '↓'}, {key: 'RIGHT', display: '→'}, {key: 'PGDN', display: '⇟'}, {key: 'KEYBOARD', display: '⌨'}] \
]

# Colors
use-black-ui = true

# Back key
back-key = escape

# Bell
bell-character = beep

# Margins
terminal-margin-horizontal = 4
terminal-margin-vertical = 1

# Shortcuts
shortcut.create-session = ctrl + t
shortcut.next-session = ctrl + 2
shortcut.previous-session = ctrl + 1
shortcut.rename-session = ctrl + n
