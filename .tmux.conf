# ─── Tmux Tokyo Night ───────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -g default-command "/data/data/com.termux/files/usr/bin/zsh"
set -g default-shell "/data/data/com.termux/files/usr/bin/zsh"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'
set -g focus-events on

set -g escape-time 10
set -g history-limit 10000

# ─── Prefix ────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind a send-prefix

# ─── Mouse ─────────────────────────────────────────────────────────
set -g mouse on
set -g mode-keys vi

# ─── Index ─────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ─── Bindings ──────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind Tab last-window
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind -r f display-popup -w 80 -h 80
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "termux-clipboard-set"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "termux-clipboard-set"

# ─── Status Bar Tokyo Night ────────────────────────────────────────
set -g status-interval 5
set -g status-style "fg=#c0caf5,bg=#1a1b26"

set -g status-left-length 60
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold]  #S #[fg=#7aa2f7,bg=#1a1b26,nobold]"

set -g status-right-length 120
set -g status-right "#[fg=#bb9af7,bg=#1a1b26]#[fg=#1a1b26,bg=#bb9af7] #H #[fg=#7dcfff,bg=#1a1b26]#[fg=#1a1b26,bg=#7dcfff] %H:%M #[fg=#c0caf5,bg=#1a1b26]#[fg=#1a1b26,bg=#c0caf5] %d/%m "

setw -g window-status-format " #[fg=#414868]#[fg=#c0caf5,bg=#1a1b26] #I:#W #[fg=#414868,bg=#1a1b26]"
setw -g window-status-current-format " #[fg=#7aa2f7]#[fg=#1a1b26,bg=#7aa2f7] #I:#W #[fg=#7aa2f7,bg=#1a1b26]"
setw -g window-status-separator ""

set -g status-position top
set -g status-justify centre

# ─── Pane Borders ──────────────────────────────────────────────────
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-style "fg=#414868"

# ─── Notifications ─────────────────────────────────────────────────
setw -g monitor-activity on
set -g visual-activity on

# ─── Clipboard (Android) ───────────────────────────────────────────
bind C-c run "tmux save-buffer - | termux-clipboard-set"
bind C-v run "termux-clipboard-get | tmux load-buffer - && tmux paste-buffer"
